<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="initial-scale=1, width=device-width">

        <link href="../bootstrap.css" rel="stylesheet">
        <script src="../bootstrap.js"></script>

        <!--<a href="https://www.flaticon.com/free-icons/planner" title="planner icons">Planner icons created by Paul J. - Flaticon</a>-->
        <link href="../planner.png" rel="icon" type="image/x-icon">

        <title>My Planner - Goals</title>
    </head>

    <body>
        <nav class="bg-light border navbar navbar-expand-md">
            <div class="container-fluid pb-2">
                <button aria-controls="navbar" aria-expanded="false" aria-label="Toggle navigation" class="navbar-toggler ms-auto" data-bs-target="#navbar" data-bs-toggle="collapse" type="button">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbar">
                    <ul class="navbar-nav mx-md-auto ms-auto text-end mt-2">
                        <li class="nav-item"><a class="nav-link" href="../goals/goals.html">Goals</a></li>
                        <li class="nav-item"><a class="nav-link" href="../matrix/matrix.html">Matrix</a></li>
                        <a class="navbar-brand ms-4 me-0" href="../index.html">My Planner</a>
                        <li class="nav-item ms-4"><a class="nav-link" href="../notes/notes.html">Notes</a></li>
                        <li class="nav-item"><a class="nav-link" href="../timer/timer.html">Timer</a></li>
                    </ul>
                </div>
            </div>
        </nav>
		<div class="fixed-top text-nowrap pe-none m-2 m-lg-3">
			<div class="d-flex align-items-center m-2 d-none" id="saving">
				<div class="spinner-border"></div>
				<span class="ms-2">Saving changes...</span>
			</div>
			<div class="d-flex align-items-center fade" id="done">
				<img src="../check.svg" style="height: 3em">
				<span>Changes saved</span>
			</div>
		</div>
        <main id="main" class="container px-5">
            <div class="row justify-content-center">
                <div class="col col-lg-4 d-flex flex-column align-items-center align-items-lg-end border border-top-0 rounded-bottom p-5 pt-0">
                    <h3 class="m-4 pb-2 border-bottom">Short term</h3>
                    <ul class="list-group mx-4" id="short">
                        <hr id="shortDivider">
                    </ul>
                </div>
                <div class="col col-lg-4 d-flex flex-column align-items-center align-items-lg-start border border-top-0 rounded-bottom p-5 pt-0">
                    <h3 class="m-4 pb-2 border-bottom">Long term</h3>
                    <ul class="list-group mx-4" id="long">
                        <hr id="longDivider">
                    </ul>
                </div>
            </div>
            <div class="d-grid gap-2 my-5 mx-auto text-center">
                <h3>Add a new goal:</h3>
                <div class="d-flex justify-content-center">
                    <div>
                        <input id="input" class="form-control" autocomplete="off" maxlength="64" required>
                        <button id="addShort" class="btn btn-primary mt-2" type="button" onclick="addGoal('short')">Short term</button>
                        <button id="addLong" class="btn btn-primary mt-2" type="button" onclick="addGoal('long')">Long term</button>
                    </div>
                </div>
            </div>
        </main>
    </body>

    <script src="../DB.js"></script>
    <script src="goals.js"></script>

</html>
